services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics_demo
      POSTGRES_USER: analytics_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Set DEMO_DB_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_demo -d analytics_demo"]
      interval: 5s
      retries: 10
volumes:
  demo-data:
